# alpsync configuration — example
#
# Copy to the alpsync directory (next to alpsync.sh), rename to
# <your-name>.conf and adjust. Or just run ./alpsync.sh and let the
# wizard create one interactively.

LABEL="laptop-sync"         # shown during sync (default: file name)
MODE="ssh"                  # "ssh" = sync to another machine,
                            # "local" = sync to a second local path

# --- MODE=ssh only ---
REMOTE_HOST="192.168.1.20"
REMOTE_USER="alice"
REMOTE_PORT="22"            # optional, default 22
REMOTE_UNISON=""            # optional; auto-detected on the remote when empty

# --- directory mapping: one pair per line, "local|remote" ---
# local side: absolute path, "~" expands to $HOME
# remote side (ssh): relative = remote home, absolute starts with "/"
PAIRS=(
  "~/Documents/projects|projects"
  "~/Photos|/srv/sync/photos"
)

# --- optional extra ignore patterns (unison syntax) ---
# "Name <glob>" matches file names anywhere below the roots,
# "Path <relpath>" matches paths relative to the sync roots.
EXTRA_IGNORES=(
  "Name node_modules"
  "Name .venv"
)
